[package]
name = "procmon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
gpui-kit = "0.6"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
mach2 = "0.7.0"
