name: Nix

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/nix.yml
  workflow_dispatch:

jobs:
  build:
    name: nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: nix build --print-build-logs

      - name: Inspect result
        run: find result/ -type f -o -type l | xargs ls -lL
